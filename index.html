<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <!--
        Configure page for mobile devices scale.
    -->
    <meta
        name="viewport"
        content="
            width=device-width,
            initial-scale=1.0,
            maximum-scale=1.0,
            user-scalable=no
        "
    >
    
ss Card AR</title>
    <!--
        Import app.js
        Allows app.js to write:
            import * as THREE from "three";
        No need to writing the complete internet URL every time.
    -->
    <script type="importmap">
    {
        "imports": {

            "three":
            "https://unpkg.com/three@0.160.0/build/three.module.js",

            "three/addons/":
            "https://unpkg.com/three@0.160.0/examples/jsm/",

            "mindar-image-three":
            "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"

        }
    }
    </script>

    <style>
        /*
           HTLM UI/Font/Scalers/Pivots
        */
        html,
        body {


            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;

        }



        /*
            DIV for MindAR / Three.js places
            Camera and WebGL content.
        */
        #ar-container {

            /*
                Only thing changed from the OG
            */
            position: fixed;

            
            inset: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;

        }



        /*
            Top DIV contains all normal HTML interface elements.
            It sits ABOVE the WebGL/camera layer for controlling
        */
        #ui {

            position: fixed;
            inset: 0;
            z-index: 10;
            /*
                !!NÃO ESQUECER DE ATIVAR OS POINTERS NO PROPRIO BOTÃO!!
            */
            pointer-events: none;

        }



        /* 
           LOGO - AQUI
        */
        #brandLogo {

            position: absolute;
            top: 18px;
            left: 50%;
            width: min(38vw, 260px);
            height: auto;
            /*
                Start invisible.
            */
            opacity: 0;
            
            transform:
                translateX(-50%)
                translateY(-10px);


            /*
                Opacity Anim
            */
            transition:
                opacity 0.6s ease,
                transform 0.6s ease;


            /*
                The logo does not need to react to touches.
            */
            pointer-events: none;

        }



        /*
            JavaScript class="visible" Inicialize
        */
        #brandLogo.visible {

            opacity: 1;
            transform:
                translateX(-50%)
                translateY(0);

        }



        /* 
           START AR BUTTON - AQUI
         */
        #startButton {
           
            position: absolute;
            left: 50%;
            top: 50%;
            transform:
                translate(-50%, -50%);
            padding: 0;
            margin: 0;
            border: none;
            background: none;
            cursor: pointer;
            pointer-events: auto;
            opacity: 1;
            transition:
                opacity 0.35s ease,
                transform 0.35s ease;

        }

        #startButton img {
           
            display: block;
            width: min(82vw, 520px);
            height: auto;
            user-select: none;
            -webkit-user-drag: none;

        }

        /*
            Start the app.js when pressed
        */
        #startButton.hidden {
           
            opacity: 0;
            pointer-events: none;
            transform:
                translate(-50%, -50%)
                scale(0.96);

        }



        /* 
           TRACKING HELP MESSAGE
           Message displayed if the user has not found
           the card after five seconds.
        */
        /* 
           TROCAR POR PNG NO FUTURO?
         */
        #scanMessage {
            position: absolute;
            left: 50%;
            top: 50%;
            transform:
                translate(-50%, -50%)
                translateY(12px);
            width: min(78vw, 420px);
            box-sizing: border-box;
            padding: 16px 22px;
            border-radius: 18px;
            background:
                rgba(0, 37, 95, 0.82);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: white;
            font-size: 16px;
            line-height: 1.4;
            text-align: center;
            opacity: 0;
            visibility: hidden;
            transition:
                opacity 0.45s ease,
                transform 0.45s ease,
                visibility 0.45s ease;
            pointer-events: none;

        }



        /*
            App.js - When should the message appear?
        */
        #scanMessage.visible {

            opacity: 1;
            visibility: visible;
            transform:
                translate(-50%, -50%)
                translateY(0);

        }



        /* 
           LEARN MORE BUTTON
        */
        #learnMore {
            position: absolute;
            left: 50%;
            bottom: 28px;
            transform:
                translateX(-50%)
                translateY(16px);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            /*
                ANIMATION
            */
            transition:
                opacity 0.4s ease,
                transform 0.4s ease,
                visibility 0.4s ease;

        }

        #learnMore img {
            display: block;
            width: min(82vw, 520px);
            height: auto;
            user-select: none;
            -webkit-user-drag: none;

        }
        
        /*
            App.js - When should learn more appear?
        */        
        #learnMore.visible {
            opacity: 1;
            visibility: visible;
            transform:
                translateX(-50%)
                translateY(0);
            pointer-events: auto;

        }


    </style>

</head>


<body>

    <!--
        MindAR and Three.js render the camera and 3D scene here.
    -->
    <div id="ar-container"></div>

    <!--
        Normal HTML user interface.
    -->
    <div id="ui">

        <!--
            Company logo.
            This starts invisible and fades in after Start AR.
        -->
        <img
            id="brandLogo"
            src="./assets/logo.png"
            alt="Logo"
        >

        <!--
            Initial Start AR button.
        -->
        <button
            id="startButton"
            aria-label="Start AR"
        >
            <!--
                Replaceable PNG button.
            -->
            <img
                src="./assets/start-ar-button.png"
                alt="Start AR"
            >


        </button>


        <!--
            5 seconds warning when not successful tracking.
        -->
        <div id="scanMessage">

            Tap Start AR and point your camera at the business card.

        </div>


        <!--
         New tab link - Learn more link
        -->
        <a
            id="learnMore"
            href="https://slidelog.pt/"
            target="_blank"
            rel="noopener"
            aria-label="Learn More"
        >


            <!--
                Replaceable Learn More image.
            -->
            <img
                src="./assets/learn-more-button.png"
                alt="Learn More"
            >


        </a>


    </div>



    <!--
        Load app.js
        type="module"? Não conseguia correr o script acho que por causa do ES6 import?
    -->
    <script
        type="module"
        src="./app.js"
    ></script>


</body>

</html>
