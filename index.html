<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>Business Card AR</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>

  <style>

    html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

#ar-container {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
}

    #ui {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    #hint {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);

      background: rgba(0, 0, 0, 0.65);
      color: white;

      padding: 10px 18px;
      border-radius: 25px;

      font-size: 14px;
      text-align: center;
      white-space: nowrap;
    }

    #startButton {
      position: absolute;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      border: none;
      border-radius: 30px;

      padding: 16px 30px;

      font-size: 18px;
      font-weight: 600;

      background: white;
      color: black;

      cursor: pointer;
      pointer-events: auto;
    }

    #learnMore {
      position: absolute;

      left: 50%;
      bottom: 45px;

      transform: translateX(-50%) translateY(20px);

      padding: 15px 28px;

      background: white;
      color: black;

      border-radius: 30px;

      font-size: 16px;
      font-weight: 600;

      text-decoration: none;

      opacity: 0;
      visibility: hidden;

      transition:
        opacity 0.3s ease,
        transform 0.3s ease;

      pointer-events: auto;
    }

    #learnMore.visible {
      opacity: 1;
      visibility: visible;

      transform: translateX(-50%) translateY(0);
    }

  </style>

</head>

<body>

  <div id="ar-container"></div>

  <div id="ui">

    <div id="hint">
      Tap Start AR
    </div>

    <button id="startButton">
      Start AR
    </button>

    <a
      id="learnMore"
      href="https://slidelog.pt/"
      target="_blank"
      rel="noopener"
    >
      Learn More
    </a>

  </div>

  <script type="module" src="./app.js"></script>

</body>
</html>
