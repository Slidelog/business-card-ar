<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Business Card AR</title>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
        }
    }
    </script>

    <style>

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }


        /* AR camera area */

        #ar-container {
            position: fixed;
            inset: 0;

            width: 100vw;
            height: 100vh;

            overflow: hidden;
        }


        /* UI overlay */

        #ui {
            position: fixed;
            inset: 0;

            z-index: 10;

            pointer-events: none;
        }



        /* ---------------------------------
           LOGO
        --------------------------------- */

        #brandLogo {
            position: absolute;

            top: 18px;
            left: 18px;

            width: min(34vw, 220px);
            height: auto;

            opacity: 0;

            transform: translateY(-10px);

            transition:
                opacity 0.6s ease,
                transform 0.6s ease;

            pointer-events: none;
        }


        #brandLogo.visible {
            opacity: 1;

            transform: translateY(0);
        }



        /* ---------------------------------
           START AR BUTTON
        --------------------------------- */

        #startButton {
            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            padding: 0;
            margin: 0;

            border: none;
            background: none;

            cursor: pointer;

            pointer-events: auto;

            opacity: 1;

            transition:
                opacity 0.35s ease,
                transform 0.35s ease;
        }


        #startButton img {
            display: block;

            width: min(82vw, 520px);
            height: auto;

            user-select: none;
            -webkit-user-drag: none;
        }


        #startButton.hidden {
            opacity: 0;

            pointer-events: none;

            transform:
                translate(-50%, -50%)
                scale(0.96);
        }



        /* ---------------------------------
           5 SECOND MESSAGE
        --------------------------------- */

        #scanMessage {
            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%)
                translateY(12px);

            width: min(78vw, 420px);

            box-sizing: border-box;

            padding: 16px 22px;

            border-radius: 18px;

            background:
                rgba(0, 37, 95, 0.82);

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            color: white;

            font-size: 16px;
            line-height: 1.4;

            text-align: center;

            opacity: 0;
            visibility: hidden;

            transition:
                opacity 0.45s ease,
                transform 0.45s ease,
                visibility 0.45s ease;

            pointer-events: none;
        }


        #scanMessage.visible {
            opacity: 1;
            visibility: visible;

            transform:
                translate(-50%, -50%)
                translateY(0);
        }



        /* ---------------------------------
           LEARN MORE
        --------------------------------- */

        #learnMore {
            position: absolute;

            left: 50%;
            bottom: 28px;

            transform:
                translateX(-50%)
                translateY(16px);

            opacity: 0;
            visibility: hidden;

            pointer-events: none;

            transition:
                opacity 0.4s ease,
                transform 0.4s ease,
                visibility 0.4s ease;
        }


        #learnMore img {
            display: block;

            width: min(82vw, 520px);
            height: auto;

            user-select: none;
            -webkit-user-drag: none;
        }


        #learnMore.visible {
            opacity: 1;
            visibility: visible;

            transform:
                translateX(-50%)
                translateY(0);

            pointer-events: auto;
        }


    </style>
</head>


<body>

    <div id="ar-container"></div>


    <div id="ui">

        <img
            id="brandLogo"
            src="./assets/logo.png"
            alt="Logo"
        >


        <button
            id="startButton"
            aria-label="Start AR"
        >

            <img
                src="./assets/start-ar-button.png"
                alt="Start AR"
            >

        </button>


        <div id="scanMessage">
            Point your camera at the business card.
        </div>


        <a
            id="learnMore"
            href="https://slidelog.pt/"
            target="_blank"
            rel="noopener"
            aria-label="Learn More"
        >

            <img
                src="./assets/learn-more-button.png"
                alt="Learn More"
            >

        </a>

    </div>


    <script
        type="module"
        src="./app.js">
    </script>

</body>

</html>
