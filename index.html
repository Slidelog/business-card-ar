<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>Business Card AR</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: transparent;
    }

    #ar-container {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    #ui {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    /* TOP LEFT LOGO */
    #brandLogo {
      position: absolute;
      top: 18px;
      left: 18px;
      width: min(34vw, 220px);
      height: auto;
      opacity: 1;
      transition: opacity 0.6s ease, transform 0.6s ease;
      transform: translateY(0);
      pointer-events: none;
    }

    #brandLogo.hidden {
      opacity: 0;
      transform: translateY(-10px);
    }

    /* IMAGE BUTTON BASE */
    .ui-image-button {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      background: none;
      border: none;
      padding: 0;
      margin: 0;
      cursor: pointer;
      pointer-events: auto;
      opacity: 1;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .ui-image-button img {
      display: block;
      width: min(82vw, 520px);
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* START BUTTON */
    #startButton {
      bottom: 28px;
    }

    /* LEARN MORE BUTTON */
    #learnMore {
      position: absolute;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%) translateY(16px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition:
        opacity 0.4s ease,
        transform 0.4s ease,
        visibility 0.4s ease;
    }

    #learnMore img {
      display: block;
      width: min(82vw, 520px);
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    #learnMore.visible {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    /* OPTIONAL small helper text */
    #statusText {
      position: absolute;
      top: 18px;
      right: 18px;
      max-width: 52vw;
      padding: 10px 14px;
      border-radius: 16px;
      background: rgba(0, 20, 70, 0.45);
      color: white;
      font-size: 14px;
      line-height: 1.35;
      text-align: right;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: opacity 0.4s ease;
      opacity: 1;
    }

    #statusText.hidden {
      opacity: 0;
    }
  </style>
</head>

<body>
  <div id="ar-container"></div>

  <div id="ui">
    <img id="brandLogo" src="./assets/logo.png" alt="Brand Logo" />

    <div id="statusText">Tap Start AR and point your camera at the business card.</div>

    <button id="startButton" class="ui-image-button" aria-label="Start AR">
      <img src="./assets/start-ar-button.png" alt="Start AR" />
    </button>

    <a
      id="learnMore"
      href="https://xyr.pt"
      target="_blank"
      rel="noopener"
      aria-label="Learn More"
    >
      <img src="./assets/learn-more-button.png" alt="Learn More" />
    </a>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
